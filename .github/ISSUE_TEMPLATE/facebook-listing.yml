name: 提交公開 Facebook 三房以上屋主房源
description: 提供公開社團的單篇永久貼文；系統會匿名補齊欄位並評估 A／B／C 房源等級。
title: "[FB房源] "
body:
  - type: markdown
    attributes:
      value: |
        這個入口不會要求 Facebook 帳號、密碼、Cookie 或 Session。
        請只提交桃園區、中壢區、平鎮區或八德區，且明確為 3 房以上的真實出租貼文。
        包租代管與仲介同業廣告不收錄；屋主在貼文中尋找代管、人在外地、沒時間管理、空屋或急租，會成為房源等級的加分訊號。
        30 至 35 坪以上、租金、照片與屋主訊號也是加分條件。
        系統不會因選填資料缺少而補造租金、坪數或照片。
        此GitHub Issue是公開的；私人社團內容請改用電子報的「私人社團授權投稿」，
        並且只有取得作者或社團管理員同意再公開的內容才能提交。
        房源成交、下架或失效後，關閉這筆 issue 即會觸發電子報重新驗證。

  - type: input
    id: permanent_url
    attributes:
      label: Facebook 永久貼文網址
      description: 必須是公開社團內的 /groups/{社團}/posts/{貼文}/ 或 /permalink/{貼文}/ 網址；分享短網址不適用。
      placeholder: https://www.facebook.com/groups/4091621327828556/posts/4623380861319264/
    validations:
      required: true

  - type: textarea
    id: post_text
    attributes:
      label: 完整貼文文字
      description: 選填。若 Facebook 暫時不向匿名訪客提供完整內容，這份文字可協助驗證格局、地區及租金。
      placeholder: 請貼上原始貼文文字，不要改寫或補造內容。
    validations:
      required: false

  - type: input
    id: image_url
    attributes:
      label: 公開照片網址
      description: 選填。可提供照片頁或直接圖片網址；系統會嘗試匿名解析並保存真實照片。
      placeholder: https://www.facebook.com/photo?fbid=...
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 真實性確認
      options:
        - label: 我確認這是現存的真實 Facebook 租屋貼文，沒有捏造房源或挪用其他物件照片。
          required: true
