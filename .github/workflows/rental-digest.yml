name: 桃園租屋快報

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/rental-digest.yml"
  workflow_dispatch:
    inputs:
      reset_history:
        description: "測試時清除48小時去重紀錄，重新顯示目前全部物件"
        required: false
        default: false
        type: boolean
      delivery_slot:
        description: "Cloudflare備援指定的LINE投遞時段；人工測試請留空"
        required: false
        default: ""
        type: string
      skip_line:
        description: "只重建與部署電子報，不額外發送LINE（維護驗證用）"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 9 * * *"
      timezone: "Asia/Taipei"
    - cron: "0 16 * * *"
      timezone: "Asia/Taipei"
    - cron: "0 22 * * *"
      timezone: "Asia/Taipei"
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  # v2 不再等待已離線的 self-hosted runner，也不會被舊的排隊執行卡住。
  group: taoyuan-rental-digest-live-v2
  cancel-in-progress: false

jobs:
  validate-branch:
    # 程式推送與投稿更新只跑測試，避免在不發 LINE 的執行中先消耗 591 限流額度。
    # 非 main 的人工執行仍可產生分支預覽。
    if: ${{ github.event_name == 'push' || github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest

    steps:
      - name: 下載測試分支
        uses: actions/checkout@v6

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: |
          # GitHub 的 Azure Ubuntu 鏡像偶爾會長時間逾時；保留官方備援鏡像，
          # 避免正式排程卡在瀏覽器安裝、錯過 LINE 投遞時段。
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|http://azure.archive.ubuntu.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          python -m playwright install --with-deps chromium

      - name: 檢查 Python 語法
        run: python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py scripts/select_validation_attempt.py

      - name: 執行資料分類測試
        run: python -m unittest discover -s tests -v

      - name: 測試時重設48小時去重紀錄
        if: ${{ inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 抓取、驗證並產生分支預覽
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          FACEBOOK_POSTS_JSON: ${{ secrets.FACEBOOK_POSTS_JSON }}
          FACEBOOK_POSTS_JSON_URL: ${{ secrets.FACEBOOK_POSTS_JSON_URL || vars.FACEBOOK_POSTS_JSON_URL }}
          FACEBOOK_PRIVATE_INBOX_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_POSTS_JSON: ${{ secrets.THREADS_POSTS_JSON }}
          THREADS_POSTS_JSON_URL: ${{ secrets.THREADS_POSTS_JSON_URL || vars.THREADS_POSTS_JSON_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_rental_digest.py

      - name: 顯示來源診斷摘要
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json
          data = json.load(open("docs/rental-data/latest.json", encoding="utf-8"))
          print(json.dumps(data["stats"], ensure_ascii=False, indent=2))
          PY

      - name: 上傳分支預覽
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: rental-digest-branch-preview
          path: docs
          retention-days: 3

  # 正式排程不能依賴可能離線的個人電腦。591 若封鎖 GitHub-hosted Runner，
  # 本輪就誠實發布 0 筆，不使用未重新驗證的舊快照；其他來源與 LINE 仍須完成。
  # 只有真正會投遞 LINE 的排程或 main 人工執行才抓正式來源。
  fresh_source_validation:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      retry_591: ${{ steps.fresh_gate.outputs.retry_591 }}

    steps:
      - name: 下載正式版
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|http://azure.archive.ubuntu.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          python -m playwright install --with-deps chromium

      - name: 檢查與測試
        run: |
          python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py scripts/select_validation_attempt.py
          python -m unittest discover -s tests -v

      - name: 決定快報版本
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          DATE=$(TZ=Asia/Taipei date +%F)
          TIME=$(TZ=Asia/Taipei date +%H%M)
          case "${EVENT_SCHEDULE}" in
            "30 9 * * *") SUFFIX="0930" ;;
            "0 16 * * *") SUFFIX="1600" ;;
            "0 22 * * *") SUFFIX="2200" ;;
            *) SUFFIX="${TIME}-manual-${GITHUB_RUN_ID}" ;;
          esac
          echo "RENTAL_EDITION_ID=${DATE}-${SUFFIX}" >> "${GITHUB_ENV}"

      - name: 測試時重設48小時去重紀錄
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 本輪重新抓取並驗證
        env:
          FACEBOOK_POSTS_JSON: ${{ secrets.FACEBOOK_POSTS_JSON }}
          FACEBOOK_POSTS_JSON_URL: ${{ secrets.FACEBOOK_POSTS_JSON_URL || vars.FACEBOOK_POSTS_JSON_URL }}
          FACEBOOK_PRIVATE_INBOX_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_POSTS_JSON: ${{ secrets.THREADS_POSTS_JSON }}
          THREADS_POSTS_JSON_URL: ${{ secrets.THREADS_POSTS_JSON_URL || vars.THREADS_POSTS_JSON_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_EGRESS: github-hosted-ubuntu
          RENTAL_591_PROXY_SERVER: ${{ secrets.RENTAL_591_PROXY_SERVER }}
          RENTAL_591_PROXY_USERNAME: ${{ secrets.RENTAL_591_PROXY_USERNAME }}
          RENTAL_591_PROXY_PASSWORD: ${{ secrets.RENTAL_591_PROXY_PASSWORD }}
          RENTAL_EDITION_ID: ${{ env.RENTAL_EDITION_ID }}
          SITE_URL: https://flyspacesky.github.io/taoyuan-rental-digest/
        run: python scripts/generate_rental_digest.py

      - name: 強制 fresh validation 閘門與診斷
        id: fresh_gate
        run: python scripts/select_validation_attempt.py inspect --latest docs/rental-data/latest.json

      - name: 上傳本輪已驗證內容
        uses: actions/upload-artifact@v4
        with:
          name: fresh-rental-validation-initial
          path: docs
          if-no-files-found: error
          retention-days: 1

  retry_591_validation:
    if: ${{ needs.fresh_source_validation.outputs.retry_591 == 'true' }}
    needs: fresh_source_validation
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      retry_591: ${{ steps.retry_gate.outputs.retry_591 }}

    steps:
      - name: 延後後改用新的 Runner 出口
        shell: bash
        env:
          REQUESTED_DELAY: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS }}
        run: |
          DELAY="${REQUESTED_DELAY:-900}"
          if ! [[ "${DELAY}" =~ ^[0-9]+$ ]]; then DELAY=900; fi
          if [ "${DELAY}" -lt 300 ]; then DELAY=300; fi
          if [ "${DELAY}" -gt 3600 ]; then DELAY=3600; fi
          echo "591 受限，等待 ${DELAY} 秒後以新的 GitHub Runner 重新驗證。"
          sleep "${DELAY}"

      - name: 下載正式版
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|http://azure.archive.ubuntu.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          python -m playwright install --with-deps chromium

      - name: 決定重試快報版本
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          DATE=$(TZ=Asia/Taipei date +%F)
          TIME=$(TZ=Asia/Taipei date +%H%M)
          case "${EVENT_SCHEDULE}" in
            "30 9 * * *") SUFFIX="0930" ;;
            "0 16 * * *") SUFFIX="1600" ;;
            "0 22 * * *") SUFFIX="2200" ;;
            *) SUFFIX="${TIME}-manual-${GITHUB_RUN_ID}" ;;
          esac
          echo "RENTAL_EDITION_ID=${DATE}-${SUFFIX}" >> "${GITHUB_ENV}"

      - name: 本輪延後重新抓取並驗證
        env:
          FACEBOOK_POSTS_JSON: ${{ secrets.FACEBOOK_POSTS_JSON }}
          FACEBOOK_POSTS_JSON_URL: ${{ secrets.FACEBOOK_POSTS_JSON_URL || vars.FACEBOOK_POSTS_JSON_URL }}
          FACEBOOK_PRIVATE_INBOX_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_POSTS_JSON: ${{ secrets.THREADS_POSTS_JSON }}
          THREADS_POSTS_JSON_URL: ${{ secrets.THREADS_POSTS_JSON_URL || vars.THREADS_POSTS_JSON_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_EGRESS: github-hosted-ubuntu-retry
          RENTAL_591_PROXY_SERVER: ${{ secrets.RENTAL_591_PROXY_SERVER }}
          RENTAL_591_PROXY_USERNAME: ${{ secrets.RENTAL_591_PROXY_USERNAME }}
          RENTAL_591_PROXY_PASSWORD: ${{ secrets.RENTAL_591_PROXY_PASSWORD }}
          RENTAL_EDITION_ID: ${{ env.RENTAL_EDITION_ID }}
          SITE_URL: https://flyspacesky.github.io/taoyuan-rental-digest/
        run: python scripts/generate_rental_digest.py

      - name: 重試 fresh validation 閘門與診斷
        id: retry_gate
        run: python scripts/select_validation_attempt.py inspect --latest docs/rental-data/latest.json

      - name: 上傳重試驗證內容
        uses: actions/upload-artifact@v4
        with:
          name: fresh-rental-validation-retry
          path: docs
          if-no-files-found: error
          retention-days: 1

  build_deploy_broadcast:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.fresh_source_validation.result == 'success' && needs.retry_591_validation.result != 'cancelled' }}
    needs: [fresh_source_validation, retry_591_validation]
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下載儲存庫
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 下載初次驗證結果
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-initial
          path: .validation/initial

      - name: 下載延後重試結果
        if: ${{ needs.retry_591_validation.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry
          path: .validation/retry

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 選擇最佳本輪 fresh validation
        id: validation_selection
        run: |
          python scripts/select_validation_attempt.py select \
            --initial .validation/initial \
            --retry .validation/retry \
            --output docs

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 檢查 Python 語法
        run: python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py scripts/select_validation_attempt.py

      - name: 執行資料分類測試
        run: python -m unittest discover -s tests -v

      - name: 測試時重設48小時去重紀錄
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 決定快報版本與 LINE 投遞時段
        id: edition
        shell: bash
        env:
          REQUESTED_SLOT: ${{ inputs.delivery_slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          SKIP_LINE: ${{ inputs.skip_line }}
        run: |
          DATE=$(TZ=Asia/Taipei date +%F)
          TIME=$(TZ=Asia/Taipei date +%H%M)
          SLOT=""
          EDITION_ID=""
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            case "${EVENT_SCHEDULE}" in
              "30 9 * * *") SLOT="${DATE}T09:30+08:00"; EDITION_ID="${DATE}-0930" ;;
              "0 16 * * *") SLOT="${DATE}T16:00+08:00"; EDITION_ID="${DATE}-1600" ;;
              "0 22 * * *") SLOT="${DATE}T22:00+08:00"; EDITION_ID="${DATE}-2200" ;;
              *) echo "無法辨識排程：${EVENT_SCHEDULE}" >&2; exit 1 ;;
            esac
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${SKIP_LINE}" != "true" ]; then
            if [[ "${REQUESTED_SLOT}" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})T([0-9]{2}):([0-9]{2})\+08:00$ ]]; then
              SLOT="${REQUESTED_SLOT}"
              EDITION_ID="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
            else
              SLOT="${REQUESTED_SLOT:-manual:${GITHUB_RUN_ID}}"
              shopt -s nullglob
              EXISTING=(docs/rental-data/editions/*-manual-${GITHUB_RUN_ID}.json)
              if [ ${#EXISTING[@]} -gt 0 ]; then
                EDITION_ID=$(basename "${EXISTING[0]}" .json)
              else
                EDITION_ID="${DATE}-${TIME}-manual-${GITHUB_RUN_ID}"
              fi
            fi
          fi
          echo "slot=${SLOT}" >> "${GITHUB_OUTPUT}"
          echo "edition_id=${EDITION_ID}" >> "${GITHUB_OUTPUT}"
          echo "LINE delivery slot: ${SLOT:-none}"
          echo "Rental edition id: ${EDITION_ID:-preview-only}"

      - name: 顯示來源診斷摘要
        run: |
          python - <<'PY'
          import json
          data = json.load(open("docs/rental-data/latest.json", encoding="utf-8"))
          print(json.dumps(data["stats"], ensure_ascii=False, indent=2))
          PY

      - name: 保存網頁、去重紀錄與租金快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/rental-data docs/assets/facebook
          if [ -d docs/archive ]; then
            git add docs/archive
          fi
          if [ -d docs/assets/threads ]; then
            git add docs/assets/threads
          fi
          if [ -d docs/assets/yungching ]; then
            git add docs/assets/yungching
          fi
          if ! git diff --cached --quiet; then
            git commit -m "rental: refresh validated listings"
            git push
          else
            echo "本次沒有需要提交的更新"
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 發送 LINE
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_line) }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DELIVERY_SLOT: ${{ steps.edition.outputs.slot }}
        run: python scripts/send_line.py

      - name: 保存 LINE 投遞紀錄
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_line) }}
        shell: bash
        run: |
          RECEIPT="docs/rental-data/delivery/${{ steps.edition.outputs.edition_id }}.json"
          if [ ! -f "${RECEIPT}" ] || [ ! -f docs/rental-data/last-delivery.json ]; then
            echo "LINE投遞成功後未產生完整紀錄" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RECEIPT}" docs/rental-data/last-delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "delivery: rental ${{ steps.edition.outputs.edition_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "LINE投遞紀錄已存在"
          fi
