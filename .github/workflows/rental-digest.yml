name: 桃園租屋快報

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/rental-digest.yml"
  workflow_dispatch:
    inputs:
      reset_history:
        description: "測試時清除48小時去重紀錄，重新顯示目前全部物件"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 8,20 * * *"
      timezone: "Asia/Taipei"
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: taoyuan-rental-digest
  cancel-in-progress: false

jobs:
  build-deploy-broadcast:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下載儲存庫
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 檢查 Python 語法
        run: python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py

      - name: 執行資料分類測試
        run: python -m unittest discover -s tests -v

      - name: 測試時重設48小時去重紀錄
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 抓取、驗證、去重並產生網頁
        env:
          FACEBOOK_POSTS_JSON: ${{ secrets.FACEBOOK_POSTS_JSON }}
          FACEBOOK_POSTS_JSON_URL: ${{ secrets.FACEBOOK_POSTS_JSON_URL || vars.FACEBOOK_POSTS_JSON_URL }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_rental_digest.py

      - name: 顯示來源診斷摘要
        run: |
          python - <<'PY'
          import json
          data = json.load(open("docs/rental-data/latest.json", encoding="utf-8"))
          print(json.dumps(data["stats"], ensure_ascii=False, indent=2))
          PY

      - name: 保存網頁、去重紀錄與租金快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/rental-data docs/assets/facebook
          if [ -d docs/assets/threads ]; then
            git add docs/assets/threads
          fi
          if ! git diff --cached --quiet; then
            git commit -m "rental: refresh validated listings"
            git push
          else
            echo "本次沒有需要提交的更新"
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 發送 LINE
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/send_line.py
