name: 桃園租屋快報

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/rental-digest.yml"
  workflow_dispatch:
    inputs:
      reset_history:
        description: "測試時清除48小時去重紀錄，重新顯示目前全部物件"
        required: false
        default: false
        type: boolean
      delivery_slot:
        description: "Cloudflare備援指定的LINE投遞時段；人工測試請留空"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "30 9 * * *"
      timezone: "Asia/Taipei"
    - cron: "0 16 * * *"
      timezone: "Asia/Taipei"
    - cron: "0 22 * * *"
      timezone: "Asia/Taipei"
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: taoyuan-rental-digest
  cancel-in-progress: false

jobs:
  validate-branch:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: 下載測試分支
        uses: actions/checkout@v6

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 檢查 Python 語法
        run: python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py

      - name: 執行資料分類測試
        run: python -m unittest discover -s tests -v

      - name: 測試時重設48小時去重紀錄
        if: ${{ inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 抓取、驗證並產生分支預覽
        env:
          FACEBOOK_POSTS_JSON: ${{ secrets.FACEBOOK_POSTS_JSON }}
          FACEBOOK_POSTS_JSON_URL: ${{ secrets.FACEBOOK_POSTS_JSON_URL || vars.FACEBOOK_POSTS_JSON_URL }}
          FACEBOOK_PRIVATE_INBOX_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_POSTS_JSON: ${{ secrets.THREADS_POSTS_JSON }}
          THREADS_POSTS_JSON_URL: ${{ secrets.THREADS_POSTS_JSON_URL || vars.THREADS_POSTS_JSON_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_rental_digest.py

      - name: 顯示來源診斷摘要
        run: |
          python - <<'PY'
          import json
          data = json.load(open("docs/rental-data/latest.json", encoding="utf-8"))
          print(json.dumps(data["stats"], ensure_ascii=False, indent=2))
          PY

      - name: 上傳分支預覽
        uses: actions/upload-artifact@v4
        with:
          name: rental-digest-branch-preview
          path: docs
          retention-days: 3

  build-deploy-broadcast:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下載儲存庫
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 檢查 Python 語法
        run: python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py

      - name: 執行資料分類測試
        run: python -m unittest discover -s tests -v

      - name: 測試時重設48小時去重紀錄
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 抓取、驗證、去重並產生網頁
        env:
          FACEBOOK_POSTS_JSON: ${{ secrets.FACEBOOK_POSTS_JSON }}
          FACEBOOK_POSTS_JSON_URL: ${{ secrets.FACEBOOK_POSTS_JSON_URL || vars.FACEBOOK_POSTS_JSON_URL }}
          FACEBOOK_PRIVATE_INBOX_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_POSTS_JSON: ${{ secrets.THREADS_POSTS_JSON }}
          THREADS_POSTS_JSON_URL: ${{ secrets.THREADS_POSTS_JSON_URL || vars.THREADS_POSTS_JSON_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_rental_digest.py

      - name: 顯示來源診斷摘要
        run: |
          python - <<'PY'
          import json
          data = json.load(open("docs/rental-data/latest.json", encoding="utf-8"))
          print(json.dumps(data["stats"], ensure_ascii=False, indent=2))
          PY

      - name: 保存網頁、去重紀錄與租金快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/rental-data docs/assets/facebook
          if [ -d docs/assets/threads ]; then
            git add docs/assets/threads
          fi
          if [ -d docs/assets/yungching ]; then
            git add docs/assets/yungching
          fi
          if ! git diff --cached --quiet; then
            git commit -m "rental: refresh validated listings"
            git push
          else
            echo "本次沒有需要提交的更新"
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 決定 LINE 投遞時段
        id: delivery-slot
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          REQUESTED_SLOT: ${{ inputs.delivery_slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "${REQUESTED_SLOT}" ]; then
            SLOT="${REQUESTED_SLOT}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            DATE=$(TZ=Asia/Taipei date +%F)
            case "${EVENT_SCHEDULE}" in
              "30 9 * * *") SLOT="${DATE}T09:30+08:00" ;;
              "0 16 * * *") SLOT="${DATE}T16:00+08:00" ;;
              "0 22 * * *") SLOT="${DATE}T22:00+08:00" ;;
              *) echo "無法辨識排程：${EVENT_SCHEDULE}" >&2; exit 1 ;;
            esac
          else
            SLOT="manual:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          fi
          echo "slot=${SLOT}" >> "${GITHUB_OUTPUT}"
          echo "LINE delivery slot: ${SLOT}"

      - name: 發送 LINE
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DELIVERY_SLOT: ${{ steps.delivery-slot.outputs.slot }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/send_line.py
