name: 桃園租屋快報

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/rental-digest.yml"
      - ".github/workflows/rental-591-retry.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/rental-digest.yml"
      - ".github/workflows/rental-591-retry.yml"
  workflow_dispatch:
    inputs:
      reset_history:
        description: "測試時清除48小時去重紀錄，重新顯示目前全部物件"
        required: false
        default: false
        type: boolean
      delivery_slot:
        description: "Cloudflare備援指定的LINE投遞時段；人工測試請留空"
        required: false
        default: ""
        type: string
      skip_line:
        description: "只重建與部署電子報，不額外發送LINE（維護驗證用）"
        required: false
        default: false
        type: boolean
      publish_prevalidated:
        description: "發布已提交且兩小時內重新驗證的合併版，不再次從GitHub Runner抓來源"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 9 * * *"
      timezone: "Asia/Taipei"
    - cron: "0 16 * * *"
      timezone: "Asia/Taipei"
    - cron: "0 22 * * *"
      timezone: "Asia/Taipei"
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  # v2 不再等待已離線的 self-hosted runner，也不會被舊的排隊執行卡住。
  group: taoyuan-rental-digest-live-v2
  cancel-in-progress: false

jobs:
  validate-branch:
    # 程式推送與投稿更新只跑測試，避免在不發 LINE 的執行中先消耗 591 限流額度。
    # 非 main 的人工執行仍可產生分支預覽。
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest

    steps:
      - name: 下載測試分支
        uses: actions/checkout@v6

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: |
          # GitHub 的 Azure Ubuntu 鏡像偶爾會長時間逾時；保留官方備援鏡像，
          # 避免正式排程卡在瀏覽器安裝、錯過 LINE 投遞時段。
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|http://azure.archive.ubuntu.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          python -m playwright install --with-deps chromium

      - name: 檢查 Python 語法
        run: python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py scripts/select_validation_attempt.py

      - name: 執行資料分類測試
        run: python -m unittest discover -s tests -v

      - name: 測試時重設48小時去重紀錄
        if: ${{ inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 抓取、驗證並產生分支預覽
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          FACEBOOK_POSTS_JSON: ${{ secrets.FACEBOOK_POSTS_JSON }}
          FACEBOOK_POSTS_JSON_URL: ${{ secrets.FACEBOOK_POSTS_JSON_URL || vars.FACEBOOK_POSTS_JSON_URL }}
          FACEBOOK_PRIVATE_INBOX_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          YUNGCHING_RENDER_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          YUNGCHING_RENDER_INTERVAL_SECONDS: ${{ vars.YUNGCHING_RENDER_INTERVAL_SECONDS || '10.5' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_POSTS_JSON: ${{ secrets.THREADS_POSTS_JSON }}
          THREADS_POSTS_JSON_URL: ${{ secrets.THREADS_POSTS_JSON_URL || vars.THREADS_POSTS_JSON_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_rental_digest.py

      - name: 顯示來源診斷摘要
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json
          data = json.load(open("docs/rental-data/latest.json", encoding="utf-8"))
          print(json.dumps(data["stats"], ensure_ascii=False, indent=2))
          PY

      - name: 上傳分支預覽
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: rental-digest-branch-preview
          path: docs
          retention-days: 3

  # 正式排程不能依賴可能離線的個人電腦。591 若限制 GitHub-hosted Runner，
  # 同輪會延後從未完成分頁續抓；四區未完整前不得部署，且不使用舊快照。
  # 只有真正會投遞 LINE 的排程或 main 人工執行才抓正式來源。
  fresh_source_validation:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.publish_prevalidated) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      retry_591: ${{ steps.fresh_gate.outputs.retry_591 }}

    steps:
      - name: 下載正式版
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|http://azure.archive.ubuntu.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          python -m playwright install --with-deps chromium

      - name: 檢查與測試
        run: |
          python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py scripts/select_validation_attempt.py
          python -m unittest discover -s tests -v

      - name: 決定快報版本
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          DATE=$(TZ=Asia/Taipei date +%F)
          TIME=$(TZ=Asia/Taipei date +%H%M)
          case "${EVENT_SCHEDULE}" in
            "30 9 * * *") SUFFIX="0930" ;;
            "0 16 * * *") SUFFIX="1600" ;;
            "0 22 * * *") SUFFIX="2200" ;;
            *) SUFFIX="${TIME}-manual-${GITHUB_RUN_ID}" ;;
          esac
          echo "RENTAL_EDITION_ID=${DATE}-${SUFFIX}" >> "${GITHUB_ENV}"

      - name: 測試時重設48小時去重紀錄
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 本輪重新抓取並驗證
        env:
          FACEBOOK_POSTS_JSON: ${{ secrets.FACEBOOK_POSTS_JSON }}
          FACEBOOK_POSTS_JSON_URL: ${{ secrets.FACEBOOK_POSTS_JSON_URL || vars.FACEBOOK_POSTS_JSON_URL }}
          FACEBOOK_PRIVATE_INBOX_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          YUNGCHING_RENDER_TOKEN: ${{ secrets.FB_INBOX_READ_TOKEN }}
          YUNGCHING_RENDER_INTERVAL_SECONDS: ${{ vars.YUNGCHING_RENDER_INTERVAL_SECONDS || '10.5' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_POSTS_JSON: ${{ secrets.THREADS_POSTS_JSON }}
          THREADS_POSTS_JSON_URL: ${{ secrets.THREADS_POSTS_JSON_URL || vars.THREADS_POSTS_JSON_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_EGRESS: github-hosted-ubuntu
          RENTAL_VALIDATION_ATTEMPT: initial
          RENTAL_591_REQUEST_INTERVAL_SECONDS: ${{ vars.RENTAL_591_REQUEST_INTERVAL_SECONDS || '1.5' }}
          RENTAL_591_PROXY_SERVER: ${{ secrets.RENTAL_591_PROXY_SERVER }}
          RENTAL_591_PROXY_USERNAME: ${{ secrets.RENTAL_591_PROXY_USERNAME }}
          RENTAL_591_PROXY_PASSWORD: ${{ secrets.RENTAL_591_PROXY_PASSWORD }}
          RENTAL_EDITION_ID: ${{ env.RENTAL_EDITION_ID }}
          SITE_URL: https://flyspacesky.github.io/taoyuan-rental-digest/
        run: python scripts/generate_rental_digest.py

      - name: 強制 fresh validation 閘門與診斷
        id: fresh_gate
        run: python scripts/select_validation_attempt.py inspect --latest docs/rental-data/latest.json

      - name: 上傳本輪已驗證內容
        uses: actions/upload-artifact@v4
        with:
          name: fresh-rental-validation-initial
          path: docs
          if-no-files-found: error
          retention-days: 1

  retry_591_validation:
    if: ${{ needs.fresh_source_validation.outputs.retry_591 == 'true' }}
    needs: fresh_source_validation
    uses: ./.github/workflows/rental-591-retry.yml
    with:
      previous_artifact: fresh-rental-validation-initial
      output_artifact: fresh-rental-validation-retry-1
      attempt_name: retry1
      runner: ${{ vars.RENTAL_591_RETRY_RUNNER || 'ubuntu-latest' }}
      requested_delay: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS || '300' }}
    secrets: inherit

  retry_591_validation_2:
    if: ${{ needs.retry_591_validation.outputs.retry_591 == 'true' }}
    needs: retry_591_validation
    uses: ./.github/workflows/rental-591-retry.yml
    with:
      previous_artifact: fresh-rental-validation-retry-1
      output_artifact: fresh-rental-validation-retry-2
      attempt_name: retry2
      runner: ${{ vars.RENTAL_591_RETRY_RUNNER || 'ubuntu-latest' }}
      requested_delay: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS || '300' }}
    secrets: inherit

  retry_591_validation_3:
    if: ${{ needs.retry_591_validation_2.outputs.retry_591 == 'true' }}
    needs: retry_591_validation_2
    uses: ./.github/workflows/rental-591-retry.yml
    with:
      previous_artifact: fresh-rental-validation-retry-2
      output_artifact: fresh-rental-validation-retry-3
      attempt_name: retry3
      runner: ${{ vars.RENTAL_591_RETRY_RUNNER || 'ubuntu-latest' }}
      requested_delay: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS || '300' }}
    secrets: inherit

  retry_591_validation_4:
    if: ${{ needs.retry_591_validation_3.outputs.retry_591 == 'true' }}
    needs: retry_591_validation_3
    uses: ./.github/workflows/rental-591-retry.yml
    with:
      previous_artifact: fresh-rental-validation-retry-3
      output_artifact: fresh-rental-validation-retry-4
      attempt_name: retry4
      runner: ${{ vars.RENTAL_591_RETRY_RUNNER || 'ubuntu-latest' }}
      requested_delay: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS || '300' }}
    secrets: inherit

  retry_591_validation_5:
    if: ${{ needs.retry_591_validation_4.outputs.retry_591 == 'true' }}
    needs: retry_591_validation_4
    uses: ./.github/workflows/rental-591-retry.yml
    with:
      previous_artifact: fresh-rental-validation-retry-4
      output_artifact: fresh-rental-validation-retry-5
      attempt_name: retry5
      runner: ${{ vars.RENTAL_591_RETRY_RUNNER || 'ubuntu-latest' }}
      requested_delay: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS || '300' }}
    secrets: inherit

  retry_591_validation_6:
    if: ${{ needs.retry_591_validation_5.outputs.retry_591 == 'true' }}
    needs: retry_591_validation_5
    uses: ./.github/workflows/rental-591-retry.yml
    with:
      previous_artifact: fresh-rental-validation-retry-5
      output_artifact: fresh-rental-validation-retry-6
      attempt_name: retry6
      runner: ${{ vars.RENTAL_591_RETRY_RUNNER || 'ubuntu-latest' }}
      requested_delay: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS || '300' }}
    secrets: inherit

  retry_591_validation_7:
    if: ${{ needs.retry_591_validation_6.outputs.retry_591 == 'true' }}
    needs: retry_591_validation_6
    uses: ./.github/workflows/rental-591-retry.yml
    with:
      previous_artifact: fresh-rental-validation-retry-6
      output_artifact: fresh-rental-validation-retry-7
      attempt_name: retry7
      runner: ${{ vars.RENTAL_591_RETRY_RUNNER || 'ubuntu-latest' }}
      requested_delay: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS || '300' }}
    secrets: inherit

  retry_591_validation_8:
    if: ${{ needs.retry_591_validation_7.outputs.retry_591 == 'true' }}
    needs: retry_591_validation_7
    uses: ./.github/workflows/rental-591-retry.yml
    with:
      previous_artifact: fresh-rental-validation-retry-7
      output_artifact: fresh-rental-validation-retry-8
      attempt_name: retry8
      runner: ${{ vars.RENTAL_591_RETRY_RUNNER || 'ubuntu-latest' }}
      requested_delay: ${{ vars.RENTAL_591_RETRY_DELAY_SECONDS || '300' }}
    secrets: inherit

  build_deploy_broadcast:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && ((github.event_name == 'workflow_dispatch' && inputs.publish_prevalidated) || (needs.fresh_source_validation.result == 'success' && needs.retry_591_validation.result != 'failure' && needs.retry_591_validation.result != 'cancelled' && needs.retry_591_validation_2.result != 'failure' && needs.retry_591_validation_2.result != 'cancelled' && needs.retry_591_validation_3.result != 'failure' && needs.retry_591_validation_3.result != 'cancelled' && needs.retry_591_validation_4.result != 'failure' && needs.retry_591_validation_4.result != 'cancelled' && needs.retry_591_validation_5.result != 'failure' && needs.retry_591_validation_5.result != 'cancelled' && needs.retry_591_validation_6.result != 'failure' && needs.retry_591_validation_6.result != 'cancelled' && needs.retry_591_validation_7.result != 'failure' && needs.retry_591_validation_7.result != 'cancelled' && needs.retry_591_validation_8.result != 'failure' && needs.retry_591_validation_8.result != 'cancelled')) }}
    needs: [fresh_source_validation, retry_591_validation, retry_591_validation_2, retry_591_validation_3, retry_591_validation_4, retry_591_validation_5, retry_591_validation_6, retry_591_validation_7, retry_591_validation_8]
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下載儲存庫
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 下載初次驗證結果
        if: ${{ !inputs.publish_prevalidated }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-initial
          path: .validation/initial

      - name: 下載第1次延後重試結果
        if: ${{ !inputs.publish_prevalidated && needs.retry_591_validation.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry-1
          path: .validation/retry1

      - name: 下載第2次延後重試結果
        if: ${{ !inputs.publish_prevalidated && needs.retry_591_validation_2.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry-2
          path: .validation/retry2

      - name: 下載第3次延後重試結果
        if: ${{ !inputs.publish_prevalidated && needs.retry_591_validation_3.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry-3
          path: .validation/retry3

      - name: 下載第4次延後重試結果
        if: ${{ !inputs.publish_prevalidated && needs.retry_591_validation_4.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry-4
          path: .validation/retry4

      - name: 下載第5次延後重試結果
        if: ${{ !inputs.publish_prevalidated && needs.retry_591_validation_5.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry-5
          path: .validation/retry5

      - name: 下載第6次延後重試結果
        if: ${{ !inputs.publish_prevalidated && needs.retry_591_validation_6.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry-6
          path: .validation/retry6

      - name: 下載第7次延後重試結果
        if: ${{ !inputs.publish_prevalidated && needs.retry_591_validation_7.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry-7
          path: .validation/retry7

      - name: 下載第8次延後重試結果
        if: ${{ !inputs.publish_prevalidated && needs.retry_591_validation_8.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fresh-rental-validation-retry-8
          path: .validation/retry8

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 逐來源合併最佳本輪 fresh validation
        if: ${{ !inputs.publish_prevalidated }}
        id: validation_selection
        run: |
          python scripts/select_validation_attempt.py merge \
            --attempt initial=.validation/initial \
            --attempt retry1=.validation/retry1 \
            --attempt retry2=.validation/retry2 \
            --attempt retry3=.validation/retry3 \
            --attempt retry4=.validation/retry4 \
            --attempt retry5=.validation/retry5 \
            --attempt retry6=.validation/retry6 \
            --attempt retry7=.validation/retry7 \
            --attempt retry8=.validation/retry8 \
            --output docs \
            --require-complete-591 \
            --require-complete-yungching

      - name: 檢查 Python 語法
        run: python -m py_compile scripts/generate_rental_digest.py scripts/send_line.py scripts/select_validation_attempt.py

      - name: 執行資料分類測試
        run: python -m unittest discover -s tests -v

      - name: 驗證預先合併的 fresh edition
        if: ${{ inputs.publish_prevalidated }}
        run: python scripts/select_validation_attempt.py verify --latest docs/rental-data/latest.json --docs docs

      - name: 測試時重設48小時去重紀錄
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_history }}
        run: |
          mkdir -p docs/rental-data
          printf '{"sent":[],"prices":{}}\n' > docs/rental-data/history.json

      - name: 決定快報版本與 LINE 投遞時段
        id: edition
        shell: bash
        env:
          REQUESTED_SLOT: ${{ inputs.delivery_slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          SKIP_LINE: ${{ inputs.skip_line }}
          PUBLISH_PREVALIDATED: ${{ inputs.publish_prevalidated }}
        run: |
          DATE=$(TZ=Asia/Taipei date +%F)
          TIME=$(TZ=Asia/Taipei date +%H%M)
          SLOT=""
          EDITION_ID=""
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            case "${EVENT_SCHEDULE}" in
              "30 9 * * *") SLOT="${DATE}T09:30+08:00"; EDITION_ID="${DATE}-0930" ;;
              "0 16 * * *") SLOT="${DATE}T16:00+08:00"; EDITION_ID="${DATE}-1600" ;;
              "0 22 * * *") SLOT="${DATE}T22:00+08:00"; EDITION_ID="${DATE}-2200" ;;
              *) echo "無法辨識排程：${EVENT_SCHEDULE}" >&2; exit 1 ;;
            esac
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${PUBLISH_PREVALIDATED}" = "true" ]; then
            SLOT="${REQUESTED_SLOT:-manual:${GITHUB_RUN_ID}}"
            EDITION_ID=$(python -c 'import json; print(json.load(open("docs/rental-data/latest.json", encoding="utf-8"))["edition_id"])')
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${SKIP_LINE}" != "true" ]; then
            if [[ "${REQUESTED_SLOT}" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})T([0-9]{2}):([0-9]{2})\+08:00$ ]]; then
              SLOT="${REQUESTED_SLOT}"
              EDITION_ID="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
            else
              SLOT="${REQUESTED_SLOT:-manual:${GITHUB_RUN_ID}}"
              shopt -s nullglob
              EXISTING=(docs/rental-data/editions/*-manual-${GITHUB_RUN_ID}.json)
              if [ ${#EXISTING[@]} -gt 0 ]; then
                EDITION_ID=$(basename "${EXISTING[0]}" .json)
              else
                EDITION_ID="${DATE}-${TIME}-manual-${GITHUB_RUN_ID}"
              fi
            fi
          fi
          echo "slot=${SLOT}" >> "${GITHUB_OUTPUT}"
          echo "edition_id=${EDITION_ID}" >> "${GITHUB_OUTPUT}"
          echo "LINE delivery slot: ${SLOT:-none}"
          echo "Rental edition id: ${EDITION_ID:-preview-only}"

      - name: 顯示來源診斷摘要
        run: |
          python - <<'PY'
          import json
          data = json.load(open("docs/rental-data/latest.json", encoding="utf-8"))
          print(json.dumps(data["stats"], ensure_ascii=False, indent=2))
          PY

      - name: 保存網頁、去重紀錄與租金快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/rental-data docs/assets/facebook
          if [ -d docs/archive ]; then
            git add docs/archive
          fi
          if [ -d docs/assets/threads ]; then
            git add docs/assets/threads
          fi
          if [ -d docs/assets/yungching ]; then
            git add docs/assets/yungching
          fi
          if ! git diff --cached --quiet; then
            git commit -m "rental: refresh validated listings"
            git push
          else
            echo "本次沒有需要提交的更新"
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 發送 LINE
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_line) }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DELIVERY_SLOT: ${{ steps.edition.outputs.slot }}
        run: python scripts/send_line.py

      - name: 保存 LINE 投遞紀錄
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_line) }}
        shell: bash
        run: |
          RECEIPT="docs/rental-data/delivery/${{ steps.edition.outputs.edition_id }}.json"
          if [ ! -f "${RECEIPT}" ] || [ ! -f docs/rental-data/last-delivery.json ]; then
            echo "LINE投遞成功後未產生完整紀錄" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RECEIPT}" docs/rental-data/last-delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "delivery: rental ${{ steps.edition.outputs.edition_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "LINE投遞紀錄已存在"
          fi
