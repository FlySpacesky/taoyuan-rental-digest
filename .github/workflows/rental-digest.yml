name: 桃園租屋快報

on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天08:17、20:17；避開整點可降低排程延遲機率
    - cron: "17 8,20 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taoyuan-rental-digest
  cancel-in-progress: false

jobs:
  build-deploy-broadcast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下載儲存庫
        uses: actions/checkout@v4

      - name: 設定Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: python -m pip install -r requirements.txt

      - name: 抓取、驗證、去重並產生網頁
        run: python scripts/generate_rental_digest.py

      - name: 保存48小時去重與租金快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/rental-data
          if ! git diff --cached --quiet; then
            git commit -m "rental: refresh validated listings"
            git push
          fi

      - name: 設定GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳Pages網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 發送LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/send_line.py
