name: 591 分頁續抓

on:
  workflow_call:
    inputs:
      previous_artifact:
        required: true
        type: string
      output_artifact:
        required: true
        type: string
      attempt_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      requested_delay:
        required: false
        default: "600"
        type: string
    outputs:
      retry_591:
        value: ${{ jobs.retry.outputs.retry_591 }}

jobs:
  retry:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 70
    outputs:
      retry_591: ${{ steps.retry_gate.outputs.retry_591 }}

    steps:
      - name: 尊重來源限流後再續抓
        shell: bash
        env:
          REQUESTED_DELAY: ${{ inputs.requested_delay }}
        run: |
          DELAY="${REQUESTED_DELAY:-600}"
          if ! [[ "${DELAY}" =~ ^[0-9]+$ ]]; then DELAY=600; fi
          if [ "${DELAY}" -lt 300 ]; then DELAY=300; fi
          if [ "${DELAY}" -gt 1200 ]; then DELAY=1200; fi
          echo "591 尚未完成，等待 ${DELAY} 秒後從未驗證分頁續抓。"
          sleep "${DELAY}"

      - name: 下載正式版
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 下載前一個同輪 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.previous_artifact }}
          path: .validation/resume

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Chromium
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|http://azure.archive.ubuntu.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          python -m playwright install --with-deps chromium

      - name: 決定重試快報版本
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          DATE=$(TZ=Asia/Taipei date +%F)
          TIME=$(TZ=Asia/Taipei date +%H%M)
          case "${EVENT_SCHEDULE}" in
            "30 9 * * *") SUFFIX="0930" ;;
            "0 16 * * *") SUFFIX="1600" ;;
            "0 22 * * *") SUFFIX="2200" ;;
            *) SUFFIX="${TIME}-manual-${GITHUB_RUN_ID}" ;;
          esac
          echo "RENTAL_EDITION_ID=${DATE}-${SUFFIX}" >> "${GITHUB_ENV}"

      - name: 從 checkpoint 未完成頁重新抓取並驗證
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_EGRESS: github-hosted-ubuntu-checkpoint-${{ inputs.attempt_name }}
          RENTAL_SOURCE_ONLY: "591"
          RENTAL_VALIDATION_ATTEMPT: ${{ inputs.attempt_name }}
          RENTAL_591_RESUME_PATH: .validation/resume/rental-data/latest.json
          RENTAL_591_REQUEST_INTERVAL_SECONDS: ${{ vars.RENTAL_591_REQUEST_INTERVAL_SECONDS || '1.5' }}
          RENTAL_591_PROXY_SERVER: ${{ secrets.RENTAL_591_PROXY_SERVER }}
          RENTAL_591_PROXY_USERNAME: ${{ secrets.RENTAL_591_PROXY_USERNAME }}
          RENTAL_591_PROXY_PASSWORD: ${{ secrets.RENTAL_591_PROXY_PASSWORD }}
          RENTAL_EDITION_ID: ${{ env.RENTAL_EDITION_ID }}
          SITE_URL: https://flyspacesky.github.io/taoyuan-rental-digest/
        run: python scripts/generate_rental_digest.py

      - name: 檢查是否仍需下一個 checkpoint
        id: retry_gate
        run: python scripts/select_validation_attempt.py inspect --latest docs/rental-data/latest.json

      - name: 上傳本次 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_artifact }}
          path: docs
          if-no-files-found: error
          retention-days: 1
